<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Fairy survey flow">
  <defs>
    <linearGradient id="wingL" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wingR" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="sparkle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="400" cy="200" rx="300" ry="150" fill="url(#wingL)" opacity="0.15"/>
  <ellipse cx="400" cy="200" rx="250" ry="120" fill="url(#wingR)" opacity="0.15"/>

  <!-- Survey flow nodes -->
  <g font-family="'Segoe UI', system-ui, sans-serif" font-size="12">
    <!-- Target -->
    <rect x="40" y="160" width="100" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="90" y="190" text-anchor="middle" fill="#334155" font-weight="600">Target URL</text>

    <!-- Arrow 1 -->
    <path d="M145 185 L175 185" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Policy -->
    <rect x="180" y="160" width="100" height="50" rx="8" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="230" y="190" text-anchor="middle" fill="#6d28d9" font-weight="600">Policy</text>

    <!-- Arrow 2 -->
    <path d="M285 185 L315 185" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Experiments -->
    <rect x="320" y="140" width="120" height="90" rx="8" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="380" y="175" text-anchor="middle" fill="#0369a1" font-weight="600">Experiments</text>
    <text x="380" y="195" text-anchor="middle" fill="#64748b" font-size="10">DNS TCP TLS</text>
    <text x="380" y="210" text-anchor="middle" fill="#64748b" font-size="10">HTTP UDP QUIC</text>

    <!-- Arrow 3 -->
    <path d="M445 185 L475 185" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Observations -->
    <rect x="480" y="140" width="120" height="90" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="540" y="175" text-anchor="middle" fill="#92400e" font-weight="600">Observations</text>
    <text x="540" y="195" text-anchor="middle" fill="#64748b" font-size="10">Evidence</text>
    <text x="540" y="210" text-anchor="middle" fill="#64748b" font-size="10">per layer</text>

    <!-- Arrow 4 -->
    <path d="M605 185 L635 185" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Report -->
    <rect x="640" y="160" width="100" height="50" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
    <text x="690" y="190" text-anchor="middle" fill="#166534" font-weight="600">Report</text>
  </g>

  <!-- Fairy creature - the surveyor -->
  <g transform="translate(380, 80)">
    <!-- Wings -->
    <path d="M-25 20 C-40 0 -60 -5 -67 10 C-70 20 -58 30 -42 32 Z" fill="url(#body)" opacity="0.7"/>
    <path d="M25 20 C40 0 60 -5 67 10 C70 20 58 30 42 32 Z" fill="url(#body)" opacity="0.7"/>
    <path d="M-22 22 C-36 35 -48 50 -52 62 C-54 68 -46 67 -34 55 C-26 45 -24 32 -22 22 Z" fill="url(#body)" opacity="0.5"/>
    <path d="M22 22 C36 35 48 50 52 62 C54 68 46 67 34 55 C26 45 24 32 22 22 Z" fill="url(#body)" opacity="0.5"/>
    <!-- Body -->
    <ellipse cx="0" cy="25" rx="5" ry="9" fill="url(#body)"/>
    <!-- Head -->
    <circle cx="0" cy="12" r="4.5" fill="url(#body)"/>
    <!-- Sparkle -->
    <g fill="#c084fc" filter="url(#sparkle)">
      <circle cx="0" cy="-5" r="2"/>
      <circle cx="-8" cy="0" r="1.2"/>
      <circle cx="8" cy="0" r="1.2"/>
      <circle cx="-5" cy="-7" r="0.8"/>
      <circle cx="5" cy="-7" r="0.8"/>
    </g>
  </g>

  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <path d="M0,0 L6,2 L0,4" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
