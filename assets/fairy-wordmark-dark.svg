<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 120" role="img" aria-label="FairySDK">
  <defs>
    <linearGradient id="fgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fgrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wings -->
  <g opacity="0.9">
    <!-- Left upper wing -->
    <path d="M55 60 C35 30 15 25 8 45 C5 55 15 65 30 70 Z" fill="url(#fgrad)" opacity="0.7"/>
    <path d="M50 60 C32 35 18 30 12 47 C10 55 20 62 33 66 Z" fill="url(#fgrad)" opacity="0.5"/>
    <!-- Left lower wing -->
    <path d="M55 60 C30 75 15 90 10 105 C8 112 18 110 35 95 C45 85 52 70 55 60 Z" fill="url(#fgrad)" opacity="0.6"/>
    <path d="M52 62 C34 76 22 88 18 100 C16 106 24 104 38 92 C46 83 50 70 52 62 Z" fill="url(#fgrad)" opacity="0.4"/>

    <!-- Right upper wing -->
    <path d="M95 60 C115 30 135 25 142 45 C145 55 135 65 120 70 Z" fill="url(#fgrad)" opacity="0.7"/>
    <path d="M100 60 C118 35 132 30 138 47 C140 55 130 62 117 66 Z" fill="url(#fgrad)" opacity="0.5"/>
    <!-- Right lower wing -->
    <path d="M95 60 C120 75 135 90 140 105 C142 112 132 110 115 95 C105 85 98 70 95 60 Z" fill="url(#fgrad)" opacity="0.6"/>
    <path d="M98 62 C116 76 128 88 132 100 C134 106 126 104 112 92 C104 83 100 70 98 62 Z" fill="url(#fgrad)" opacity="0.4"/>
  </g>

  <!-- Body -->
  <ellipse cx="75" cy="60" rx="6" ry="10" fill="url(#fgrad2)"/>

  <!-- Head -->
  <circle cx="75" cy="46" r="5" fill="url(#fgrad2)"/>

  <!-- Sparkle trail -->
  <g fill="#d8b4fe" filter="url(#glow)">
    <circle cx="115" cy="52" r="2"/>
    <circle cx="125" cy="42" r="1.5"/>
    <circle cx="135" cy="35" r="1"/>
    <circle cx="130" cy="55" r="1.2"/>
    <circle cx="142" cy="48" r="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#c084fc">Fairy</text>
  <text x="310" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="300" fill="#e2e8f0">SDK</text>

  <!-- Tagline -->
  <text x="162" y="105" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="3">EVIDENCE-FIRST NETWORK DIAGNOSTICS</text>
</svg>
